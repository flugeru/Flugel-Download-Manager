name: Build Windows installer (unsigned)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 0.2.3). Defaults to 0.0.0-ci."
        required: false
        default: "0.0.0-ci"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "browser/**"
      - "installer/**"
      - "build.ps1"
      - "build-installer.ps1"
      - ".github/workflows/build-installer.yml"

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }

      - name: Build unsigned installer
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0-ci" }
          ./build-installer.ps1 -Version $version

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: FlugelDownloadManager-installer-unsigned
          if-no-files-found: error
          path: |
            artifacts/installer/FlugelDownloadManager-Setup-*.exe
            artifacts/installer/SHA256SUMS.txt
